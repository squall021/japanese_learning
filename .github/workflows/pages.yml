name: Deploy Japanese Learning

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      restore_ref:
        description: 'Checkpoint tag or commit to deploy (blank = current main)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected version
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.restore_ref || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify syntax and learning flows
        run: |
          node --check dist/app.js
          node --check dist/data.js
          if [ -f dist/handwriting/handwriting.js ]; then node --check dist/handwriting/handwriting.js; fi
          node verify.mjs
          if [ -f verify-handwriting.mjs ]; then node verify-handwriting.mjs; fi
          if [ -f verify-particles.mjs ]; then node verify-particles.mjs; fi
          if [ -f verify-variations.mjs ]; then node verify-variations.mjs; fi
          if [ -f verify-grammar.mjs ]; then node verify-grammar.mjs; fi
      - name: Record deployed source
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Upload website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
